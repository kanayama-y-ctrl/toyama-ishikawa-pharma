const listEl = document.getElementById('list'), countEl = document.getElementById('count'),
      emptyEl = document.getElementById('empty'), q = document.getElementById('q');
let filter = 'toyama-mfg';
try { filter = localStorage.getItem('pharma-filter') || filter; } catch (e) {}

const match = r => filter === 'all' ||
  (filter === 'ishikawa' && r.pref === '石川') ||
  (filter === 'toyama-mfg' && r.pref === '富山' && r.cat === '製造業者') ||
  (filter === 'toyama-rel' && r.pref === '富山' && r.cat === '関連企業');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => s.normalize('NFKC').toLowerCase();

function render() {
  const term = fold(q.value.trim());
  const rows = DATA.filter(r => match(r) && (!term || fold(r.name + r.addr + r.desc).includes(term)));
  listEl.innerHTML = rows.map(r => `<li>
    <div class="main">
      <div class="name"><span class="tag${r.pref === '石川' ? ' ishikawa' : ''}">${r.pref}${r.cat === '関連企業' ? '・関連' : ''}</span>${esc(r.name)}</div>
      ${r.addr ? `<div class="meta">${esc(r.addr)}${r.emp ? `　従業員 ${r.emp}人` : ''}</div>` : ''}
      ${r.desc ? `<div class="desc">${esc(r.desc)}</div>` : ''}
    </div>
    <div class="acts"><a href="${r.map}" target="_blank" rel="noopener">地図</a><a href="${r.web}" target="_blank" rel="noopener">検索</a></div>
  </li>`).join('');
  countEl.textContent = `${rows.length} 社を表示`;
  emptyEl.hidden = rows.length > 0;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter));
}
document.querySelectorAll('.tabs button').forEach(b => {
  const n = DATA.filter(r => { const f = filter; filter = b.dataset.f; const m = match(r); filter = f; return m; }).length;
  b.textContent += ` ${n}`;
  b.addEventListener('click', () => { filter = b.dataset.f; try { localStorage.setItem('pharma-filter', filter); } catch (e) {} render(); });
});
q.addEventListener('input', render);
render();
</script>
